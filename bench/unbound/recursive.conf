# Unbound 1.26 (official Windows x64 build, run as a plain process, no service):
# full recursion from the root servers for wincrawl's DNS A/B.
#   unbound.exe -d -c bench\unbound\recursive.conf
#   wincrawl --dns 127.0.0.1:5335 ...
# bench/unbound/farm.py starts N copies on consecutive ports (see num-threads below).
# Measured result: far slower than querying 1.1.1.1 directly; see
# bench/results/internet-tuning.md.
server:
    interface: 127.0.0.1@5335
    port: 5335
    access-control: 127.0.0.0/8 allow
    do-ip6: no                 # no IPv6 upstream path to rely on; avoids AAAA-only NS timeouts
    # The Windows build has no libevent: each thread waits with WSAWaitForMultipleEvents,
    # which caps it at 64 sockets ("event_add failed" beyond that), and all queries on one
    # listening socket land on one thread. So: one thread per process, the default 48
    # upstream ports, extra queries queue for a port, and farm.py runs N processes.
    num-threads: 1
    outgoing-range: 48
    num-queries-per-thread: 256
    incoming-num-tcp: 2
    outgoing-num-tcp: 4
    so-rcvbuf: 8m
    so-sndbuf: 8m
    # Per process. Crawl names are almost all unique, so the cache only has to hold
    # what N processes see of one run.
    msg-cache-size: 64m
    rrset-cache-size: 128m
    key-cache-size: 4m
    msg-cache-slabs: 1
    rrset-cache-slabs: 1
    infra-cache-slabs: 1
    key-cache-slabs: 1
    infra-cache-numhosts: 100000
    # Crawling needs addresses, not validation: the validator would add DS/DNSKEY
    # lookups (more packets through a packet-rate-limited home router).
    module-config: "iterator"
    qname-minimisation: no     # one query per zone cut instead of one per label
    minimal-responses: yes
    prefetch: no
    edns-buffer-size: 1232
    verbosity: 1
    use-syslog: no
    logfile: ""
    pidfile: ""
    chroot: ""
    username: ""
    statistics-cumulative: no
    extended-statistics: yes
remote-control:
    control-enable: yes
    control-interface: 127.0.0.1
    control-port: 5336
    control-use-cert: no
